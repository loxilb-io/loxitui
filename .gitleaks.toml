# Gitleaks configuration for loxitui-inference-gateway.
# Extends the default ruleset; allowlists are scoped to known-fake fixtures
# and documentation placeholders only. Anything else that trips a rule is a
# real finding and must be removed, not allowlisted.

[extend]
useDefault = true

[allowlist]
description = "Known-fake fixtures and documentation placeholders"
paths = [
  # Audit-logger tests use deliberately fake secrets to verify redaction
  '''tests/audit\.test\.ts''',
]
regexes = [
  # Truncated example JWT in API documentation (not a real token)
  '''eyJhbGciOiJIUzI1NiIs\.\.\.''',
  # Placeholder patterns
  '''CHANGE_ME''',
  '''<[A-Z_]+>''',
]
