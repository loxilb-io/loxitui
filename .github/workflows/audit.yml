name: Dependency Audit

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 4 * * 1" # weekly, Monday 04:00 UTC
  workflow_dispatch:

permissions:
  contents: read

env:
  BUN_VERSION: 1.3.6

jobs:
  audit:
    name: bun audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Full advisory report (informational)
        run: bun audit || true
      # Gate philosophy mirrors loxilb-oam's govulncheck gate: block only on
      # what demands action (high/critical); moderate/low transitive advisories
      # in the pinned pre-1.0 @opentui stack are tracked, not blocking.
      - name: Blocking gate (high/critical)
        run: bun audit --audit-level=high
