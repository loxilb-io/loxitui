name: E2E Testbed

# Nightly practical run against the real hardware testbed: ships the compiled
# linux binary over SSH, drives the CLI against the gateway container there,
# then runs the tests/e2e suite through an SSH tunnel. Complements the
# per-PR `e2e-gateway` job in ci.yml, which covers the same suite in a
# runner-local container.
#
# Requires repository secrets (no credentials live in the repo):
#   TESTBED_HOST     testbed address
#   TESTBED_USER     ssh user
#   TESTBED_SSH_KEY  private key authorized on the testbed
# When the secrets are absent (e.g. forks), the run skips cleanly.

on:
  schedule:
    - cron: "30 17 * * *" # 02:30 KST nightly
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-testbed
  cancel-in-progress: false

env:
  BUN_VERSION: 1.3.6

jobs:
  testbed:
    name: Remote testbed E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check testbed secrets
        id: gate
        env:
          KEY: ${{ secrets.TESTBED_SSH_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::TESTBED_SSH_KEY not configured — skipping testbed E2E"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: steps.gate.outputs.enabled == 'true'

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        if: steps.gate.outputs.enabled == 'true'
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        if: steps.gate.outputs.enabled == 'true'
        run: bun install --frozen-lockfile

      - name: Install SSH key
        if: steps.gate.outputs.enabled == 'true'
        env:
          KEY: ${{ secrets.TESTBED_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Run testbed E2E cycle
        if: steps.gate.outputs.enabled == 'true'
        env:
          TESTBED_HOST: ${{ secrets.TESTBED_HOST }}
          TESTBED_USER: ${{ secrets.TESTBED_USER }}
        run: ./scripts/e2e-testbed.sh
