name: DCO

# Every commit in a PR must carry a matching Signed-off-by trailer.
on:
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  dco:
    name: dco
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check sign-off
        run: |
          fail=0
          for c in $(git rev-list --no-merges "origin/${{ github.base_ref }}..HEAD"); do
            if ! git log -1 --format=%B "$c" | grep -qE '^Signed-off-by: .+ <.+@.+>$'; then
              echo "::error::commit $c is missing a Signed-off-by line (use git commit -s)"
              fail=1
            fi
          done
          exit $fail
