name: DCO

# Enforces the Developer Certificate of Origin sign-off documented in
# CONTRIBUTING.md: every commit in a pull request must carry a
# `Signed-off-by:` trailer (`git commit -s`). Runs on PRs only, so existing
# history is not retroactively failed.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dco:
    name: Signed-off-by check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Verify every PR commit is signed off
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          missing=0
          for sha in $(git rev-list --no-merges "origin/${BASE_REF}..HEAD"); do
            if ! git log -1 --format=%B "$sha" | grep -Eqi '^Signed-off-by: .+ <.+@.+>'; then
              echo "::error::commit ${sha} is missing a Signed-off-by trailer (use 'git commit -s')"
              git log -1 --format='%h %s' "$sha"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "See CONTRIBUTING.md § 'Sign your commits (DCO)'."
            exit 1
          fi
          echo "All commits carry a Signed-off-by trailer."
