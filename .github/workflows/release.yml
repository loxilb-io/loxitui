name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  BUN_VERSION: 1.3.6
  IMAGE: ghcr.io/loxilb-io/loxitui

jobs:
  release:
    name: Build, gate, sign, publish
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write # create the GitHub Release
      packages: write # push to GHCR
      id-token: write # Cosign keyless signing + attestations
      attestations: write # SLSA provenance / SBOM attestations
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Resolve version from tag
        id: ver
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          BASE="${VERSION%%-*}"
          PKG=$(bun -e 'console.log(JSON.parse(await Bun.file("package.json").text()).version)')
          if [ "$BASE" != "$PKG" ]; then
            echo "FAIL: tag $TAG (base $BASE) does not match package.json version $PKG" >&2
            exit 1
          fi
          if [ "$VERSION" != "$BASE" ]; then PRERELEASE=true; else PRERELEASE=false; fi
          TAGS="${IMAGE}:${VERSION}"
          if [ "$PRERELEASE" = false ]; then TAGS="${TAGS},${IMAGE}:latest"; fi
          {
            echo "tag=$TAG"
            echo "version=$VERSION"
            echo "prerelease=$PRERELEASE"
            echo "image_tags=$TAGS"
          } >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Fetch cross-platform @opentui packages
        run: ./scripts/fetch-platform-deps.sh

      - name: Compile platform binaries
        run: |
          bun run build:linux-x64
          bun run build:linux-arm64
          bun run build:darwin-x64
          bun run build:darwin-arm64

      - name: Smoke-test native binary
        run: |
          ./dist/loxitui-linux-x64 version
          ./dist/loxitui-linux-x64 help

      - name: Package tarballs and checksums
        run: |
          VERSION='${{ steps.ver.outputs.version }}'
          mkdir -p dist/release
          for target in linux-x64 linux-arm64 darwin-x64 darwin-arm64; do
            stage="dist/stage/loxitui-${VERSION}-${target}"
            mkdir -p "$stage"
            install "dist/loxitui-${target}" "$stage/loxitui"
            cp LICENSE NOTICE README.md CHANGELOG.md "$stage/"
            tar -czf "dist/release/loxitui-${VERSION}-${target}.tar.gz" -C dist/stage "loxitui-${VERSION}-${target}"
          done
          (cd dist/release && sha256sum -- *.tar.gz > SHA256SUMS)
          cat dist/release/SHA256SUMS

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build amd64 image for scanning (not pushed)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: loxitui:scan

      - name: Trivy gate — CRITICAL and fixable blocks the release
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: loxitui:scan
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push multi-arch image
        id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.ver.outputs.image_tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/loxilb-io/loxitui
            org.opencontainers.image.version=${{ steps.ver.outputs.version }}
            org.opencontainers.image.licenses=Apache-2.0

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Cosign sign image (keyless)
        run: cosign sign --yes "${IMAGE}@${{ steps.push.outputs.digest }}"

      - name: SLSA provenance attestation — image
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Generate SPDX SBOM for image
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: SBOM attestation — image
        uses: actions/attest-sbom@bd218ad0dbcb3e146bd073d1d9c6d78e08aa8a0b # v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true

      - name: SLSA provenance attestation — release tarballs
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: dist/release/*.tar.gz

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: loxitui ${{ steps.ver.outputs.tag }}
          prerelease: ${{ steps.ver.outputs.prerelease }}
          generate_release_notes: true
          files: |
            dist/release/*.tar.gz
            dist/release/SHA256SUMS
            sbom.spdx.json
