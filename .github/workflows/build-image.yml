name: Build Image

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - src/**
      - loxilb-knowledge/**
      - scripts/**
      - package.json
      - bun.lock
      - .github/workflows/build-image.yml
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Container build (no push)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build amd64 image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: loxitui:ci
      - name: Smoke-test image
        run: docker run --rm loxitui:ci version
      # Advisory scan on PRs/pushes; the release pipeline runs the
      # blocking CRITICAL gate before any image is published.
      - name: Trivy scan (advisory)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        continue-on-error: true
        with:
          image-ref: loxitui:ci
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"
