# Dependabot: weekly version-update PRs for Go modules and GitHub Actions.
# Every PR still needs code-owner approval and green CI like any other change.
version: 2
updates:
  - package-ecosystem: gomod
    directory: "/"
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
  - package-ecosystem: docker
    directory: "/"
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
