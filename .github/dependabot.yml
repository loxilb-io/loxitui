version: 2
updates:
  # Bun resolves from the npm registry; dependabot's npm ecosystem covers
  # package.json. (bun.lock is regenerated by `bun install` on merge.)
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    ignore:
      # @opentui is pre-1.0 and its API moves between patch releases; the
      # exact pins are deliberate. Bump manually after testing the TUI.
      - dependency-name: "@opentui/*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
